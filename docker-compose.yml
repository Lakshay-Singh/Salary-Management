# Local PostgreSQL for development and the integration tests.
# From backend/: npm run db:up (start and wait until healthy), npm run db:down (stop).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salaries
      POSTGRES_PASSWORD: salaries
      POSTGRES_DB: salaries
    ports:
      - "5433:5432" # 5433 so it never clashes with a Postgres already installed on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salaries -d salaries"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
